<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stage VR Proof-of-Concept</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Instrument+Sans:wght@400;500;600&display=swap">

<style>
  :root{
    --ink:#0B0C0E;
    --surface:#15171A;
    --surface-2:#1D2025;
    --line:#2A2E34;
    --text:#F1F3F5;
    --muted:#99A0A9;
    --brass:#C9913F;
    --brass-dim:#8A6329;
    --warn:#E0A6A6;
    --display:"Fraunces", Georgia, "Times New Roman", serif;
    --ui:"Instrument Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color-scheme: dark;
  }
  *{box-sizing:border-box;}
  html{min-height:100%;}
  body{
    margin:0;padding:0;min-height:100vh;min-height:100dvh;
    background:var(--ink);
    color:var(--text);
    font-family:var(--ui);
    -webkit-font-smoothing:antialiased;
  }
  canvas{display:block;position:fixed;inset:0;width:100%;height:100%;z-index:0;}

  #ui{
    position:relative; z-index:2; min-height:100vh; min-height:100dvh;
    padding:34px 20px 56px;
    background:
      radial-gradient(120% 70% at 50% -8%, rgba(201,145,63,0.11) 0%, rgba(11,12,14,0) 60%),
      var(--ink);
  }
  .wrap{max-width:460px;margin:0 auto;}

  h1{
    font-family:var(--display);
    font-weight:600; font-size:34px; line-height:1.08; letter-spacing:-0.015em;
    margin:0 0 14px; text-wrap:balance;
  }
  .rule{height:1px;background:linear-gradient(90deg,var(--brass),rgba(201,145,63,0));margin:0 0 18px;}
  .sub{font-size:14.5px;line-height:1.6;color:var(--muted);margin:0 0 26px;}
  .sub b{color:var(--text);font-weight:500;}

  /* the select still drives loadSky and what gets saved; the tiles set it */
  #env{display:none;}

  .pick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 28px;}
  .tile{
    position:relative;padding:0;border:1px solid var(--line);border-radius:12px;
    background:var(--surface);overflow:hidden;cursor:pointer;text-align:left;
    -webkit-tap-highlight-color:transparent;
  }
  .tile .shot{
    display:block;height:104px;background-size:cover;background-position:center;
    filter:saturate(.85) brightness(.8);
  }
  .tile[data-env="img-stage"] .shot{background-image:url(hill-stage.jpg);background-position:48% 58%;}
  .tile[data-env="img-green"] .shot{background-image:url(hill-greenroom.jpg);background-position:75% 55%;}
  .tile .cap{
    display:block;padding:11px 12px 12px;font-size:14.5px;font-weight:500;color:var(--text);
  }
  .tile[aria-pressed="true"]{border-color:var(--brass);}
  .tile[aria-pressed="true"] .shot{filter:none;}
  .tile[aria-pressed="true"]::after{
    content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--brass);
  }

  details{margin:2px 0 6px;}
  details summary{
    font-size:12.5px;color:var(--brass);cursor:pointer;padding:6px 2px;list-style:none;
  }
  details summary::-webkit-details-marker{display:none;}
  details summary::before{content:"+ ";font-weight:600;}
  details[open] summary::before{content:"- ";}
  details p{font-size:12.8px;line-height:1.6;color:var(--muted);margin:2px 2px 10px;}
  details p b{color:var(--text);font-weight:600;}

  button{font-family:var(--ui);}
  button.go{
    width:100%;padding:16px;font-size:16px;font-weight:600;letter-spacing:.01em;
    border:0;border-radius:10px;background:var(--text);color:#0B0C0E;cursor:pointer;
  }
  button.go:hover{background:#fff;}
  button.ghost{
    width:100%;padding:15px;font-size:16px;border:1px solid var(--line);border-radius:10px;
    background:transparent;color:var(--muted);cursor:pointer;margin-top:10px;
  }
  button.ghost:hover{color:var(--text);border-color:var(--muted);}
  :focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

  .note{font-size:12.8px;color:var(--muted);line-height:1.6;margin:16px 0 0;}
  ul.note{margin:20px 0 0;padding:0;list-style:none;}
  ul.note li{position:relative;padding:0 0 0 16px;margin:0 0 7px;}
  ul.note li::before{
    content:"";position:absolute;left:0;top:8px;width:5px;height:5px;
    border-radius:50%;background:var(--brass);
  }
  .note b{color:var(--text);font-weight:600;}
  #err{color:var(--warn);font-size:12.8px;line-height:1.6;margin-top:12px;}

  #hud{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:4;display:none;gap:8px;}
  #hud button{
    padding:9px 15px;font-size:12.5px;border-radius:999px;border:1px solid rgba(239,233,223,.22);
    background:rgba(14,13,12,.62);color:var(--text);backdrop-filter:blur(8px);cursor:pointer;
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;}}
</style>
</head>
<body>


<div id="ui"><div class="wrap">
  <h1>Stage VR Proof-of-Concept</h1>
  <div class="rule"></div>
  <p class="sub">Hill Auditorium in 360, from the piano bench. For a
     <b>Google Cardboard viewer and any phone</b>.</p>

  <p class="pick">Where do you want to start?</p>
  <div class="tiles">
    <button class="tile" type="button" data-env="img-stage" aria-pressed="true">
      <span class="shot"></span><span class="cap">On stage</span>
    </button>
    <button class="tile" type="button" data-env="img-green" aria-pressed="false">
      <span class="shot"></span><span class="cap">Green room</span>
    </button>
  </div>

  <select id="env" aria-label="Environment">
    <option value="img-stage">On stage</option>
    <option value="img-green">Green room</option>
  </select>

  <button class="go" id="enter">Enter VR</button>
  <button class="ghost" id="peek">Look around on this screen first</button>
  <button class="ghost" id="forget">Forget my setup and start fresh</button>

  <ul class="note">
    <li>Hold the phone in <b>landscape</b> once you are in.</li>
    <li>Move, resize or hide anything from the <b>menu above your head</b>.</li>
  </ul>
  <p class="note" id="modeNote"></p>
  <p id="err" role="status"></p>
</div></div>

<div style="display:none" aria-hidden="true">
  <img id="img-stage" alt="" src="hill-stage.jpg">
  <img id="img-green" alt="" src="hill-greenroom.jpg">
</div>

<div id="hud">
  <button id="exit">Exit</button>
  <button id="recenter">Recenter</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
function bootPracticeSpace() {
  'use strict';
  if (typeof THREE === 'undefined') {
    var e0 = document.getElementById('err');
    if (e0) e0.textContent = 'The 3D library did not load, so only this screen works. Open the page directly rather than inside a preview frame.';
    return;
  }

  var ui = document.getElementById('ui');
  var hud = document.getElementById('hud');
  var errEl = document.getElementById('err');

  var renderer, scene, camera, sky, skyTex, videoEl, videoTex;
  var reticle, reticleRing, hintPlate = null, menuTip = null;
  // the pointer to the tab retires for good once you have opened the menu once
  var menuFound = false;
  var pickables = [];
  var mode = 'flat';
  var inScene = false;
  var orient = null;
  var dragging = false, dragX = 0, dragY = 0, yaw = 0, pitch = 0, yawOffset = 0;

  var EYE = 1.15;

  // two independent windows on the real room, both fed by the one rear camera.
  // the music window hangs in front of your face; the piano lies flat where the
  // real keybed is, so its body can be built around it in the right orientation.
  // Both rigs start a little to the left of where you are facing, so the default
  // view is you angled out towards the house rather than square to your own
  // keys, which is how you actually sit at the instrument on a stage. One number
  // moves the piano and the music window together; they belong to each other.
  var RIG_YAW = THREE.MathUtils.degToRad(-10);

  var piano = {
    kind: 'deck', on: true,
    yaw: RIG_YAW, drop: 0.46, dist: 0.44, width: 1.0,
    group: null, win: null, fallback: null
  };

  // Music windows are a list rather than one fixed panel. Width and height move
  // independently, which covers square, letterbox and portrait without needing
  // preset shapes; round is the one shape that is not just an aspect ratio, so
  // it is a toggle. Three is a cap: past that the menu stops being a menu.
  // One window is what ships. The list, the add and remove entries and the menu
  // paging all still work for more: raise this and they reappear on their own.
  var PANEL_MAX = 1;
  var panels = [];

  var raycaster = new THREE.Raycaster();
  var gazeHit = null, gazeHeld = 0, movingRig = null, recentering = false, lastT = 0;
  var steady = 0, lastDir = new THREE.Vector3(), swingAvg = 0, moveAge = 0;
  var pendingRecenter = false;
  // where you were looking when a hold was armed, and how far off that you must
  // get before a recenter will commit. without it, picking recenter and then
  // simply not moving would set front to the menu you were staring at.
  var armDir = new THREE.Vector3(), MIN_TURN = 15;
  // seconds of gaze to ignore after something fires. without it the stare that
  // chose a menu item carries straight on into whatever replaces it.
  var cooldown = 0, COOLDOWN = 0.7, mustLeave = null;
  // nothing in the scene except the menu answers to your gaze. you can stare at
  // your own keys through the piano window for as long as you like.
  var DWELL = 0.85, REPEAT_DELAY = 0.28, PLACE_DWELL = 0.9;
  // How still "still" has to be, in degrees per second. A phone's orientation
  // stream jitters by a fraction of a degree between frames even on a head that
  // is not moving, and at 60fps a tenth of a degree already reads as 6 deg/sec,
  // so a tight limit measures noise rather than you. Turning to look at
  // something runs into the hundreds, so this still tells the two apart.
  var STEADY_LIMIT = 25;
  var SWING_SMOOTH = 0.12;   // seconds of smoothing on the speed estimate
  var STEADY_DECAY = 2;      // a wobble costs progress at this rate, never all of it
  var MIN_MOVE = 0.6;        // seconds before a placement can complete at all
  // width units per second while you hold a gaze on smaller or bigger. the whole
  // range is 0.4 to 2.4, so this crosses it in eight seconds; at 0.8 it crossed
  // in under three and you could not stop where you meant to.
  var SIZE_RATE = 0.25;
  var tmpQ = new THREE.Quaternion(), vDir = new THREE.Vector3(), vPos = new THREE.Vector3();

  function init() {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 1000);
    camera.position.set(0, EYE, 0);
    scene.add(camera);

    var geo = new THREE.SphereGeometry(60, 64, 40);
    geo.scale(-1, 1, 1);
    sky = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0x14110f }));
    scene.add(sky);

    // the panorama is unlit basic material; these lights exist only so the
    // piano body has some shape to it instead of reading as a black silhouette
    scene.add(new THREE.AmbientLight(0xffffff, 0.30));
    var key = new THREE.DirectionalLight(0xFFE6C2, 1.15);
    key.position.set(-1.4, 2.0, 0.5);
    scene.add(key);
    var fill = new THREE.DirectionalLight(0x9FB6D4, 0.45);
    fill.position.set(1.2, 0.7, -0.8);
    scene.add(fill);
    // a hard light almost overhead is what puts the long streak down a polished lid
    var sheen = new THREE.DirectionalLight(0xFFF4E2, 0.7);
    sheen.position.set(0.4, 3.0, -2.0);
    scene.add(sheen);

    buildPianoRig();
    buildMenu();
    buildReticle();
    placeAll();

    window.addEventListener('resize', onResize);
    renderer.setAnimationLoop(render);
  }

  // ---------- geometry helpers ----------

  // Both windows are holes in the panorama showing whatever the rear camera can
  // actually see behind them. Rather than crop the frame, each fragment is
  // projected back through a virtual camera sitting at your head and pointed
  // where you are pointed, which is where the phone's lens really is. Wherever
  // that projection lands outside the frame, the window is black, because the
  // camera genuinely cannot see there.
  //
  // Both meshes share one material, so the projection is computed once a frame.
  var PHONE_FOV_H = 65;   // degrees across, about what a phone rear camera gives back
  var winMat = null;
  var phoneCam = new THREE.PerspectiveCamera();

  function windowMaterial() {
    if (winMat) return winMat;
    winMat = new THREE.ShaderMaterial({
      uniforms: {
        uVideo:    { value: null },
        uHasVideo: { value: 0 },
        uCamProj:  { value: new THREE.Matrix4() }
      },
      vertexShader: [
        'uniform mat4 uCamProj;',
        'varying vec4 vProj;',
        'void main() {',
        '  vec4 wp = modelMatrix * vec4(position, 1.0);',
        '  vProj = uCamProj * wp;',
        '  gl_Position = projectionMatrix * viewMatrix * wp;',
        '}'
      ].join('\n'),
      fragmentShader: [
        'uniform sampler2D uVideo;',
        'uniform float uHasVideo;',
        'varying vec4 vProj;',
        'void main() {',
        '  if (uHasVideo < 0.5 || vProj.w <= 0.0) { gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return; }',
        // the divide happens per fragment, so the mapping stays correct on a
        // plane lying flat under you as well as one square to your face
        '  vec2 uv = (vProj.xy / vProj.w) * 0.5 + 0.5;',
        '  if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) {',
        '    gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); return;',
        '  }',
        '  gl_FragColor = vec4(texture2D(uVideo, uv).rgb, 1.0);',
        '}'
      ].join('\n')
    });
    return winMat;
  }

  // the lens rides on your head, so the virtual camera takes the head pose. in
  // stereo both eyes get the same projection, which is honest: there is one lens.
  function updateWindowProjection() {
    if (!winMat) return;
    var vc = viewCamera();
    vc.updateMatrixWorld();
    phoneCam.position.setFromMatrixPosition(vc.matrixWorld);
    vc.getWorldQuaternion(phoneCam.quaternion);

    var aspect = (videoEl && videoEl.videoWidth && videoEl.videoHeight)
      ? videoEl.videoWidth / videoEl.videoHeight : 4 / 3;
    // phone cameras are quoted across; three wants the vertical angle
    phoneCam.fov = 2 * THREE.MathUtils.radToDeg(
      Math.atan(Math.tan(THREE.MathUtils.degToRad(PHONE_FOV_H) / 2) / aspect)
    );
    phoneCam.aspect = aspect;
    phoneCam.near = 0.05;
    phoneCam.far = 100;
    phoneCam.updateProjectionMatrix();
    phoneCam.updateMatrixWorld(true);

    winMat.uniforms.uCamProj.value.multiplyMatrices(
      phoneCam.projectionMatrix, phoneCam.matrixWorldInverse
    );
  }

  // a drawn keybed, sitting in the piano window until the camera hands over a
  // picture, and left there if it never does. it is a placeholder, not your keys.
  function keybedTexture() {
    var c = document.createElement('canvas');
    c.width = 1024; c.height = 300;
    var g = c.getContext('2d');
    g.fillStyle = '#08080A'; g.fillRect(0, 0, 1024, 300);

    var n = 36, w = 1024 / n, i;
    for (i = 0; i < n; i++) {
      var grd = g.createLinearGradient(0, 44, 0, 300);
      grd.addColorStop(0, '#7C786F');
      grd.addColorStop(0.35, '#B4AEA3');
      grd.addColorStop(1, '#DAD5CA');
      g.fillStyle = grd;
      g.fillRect(i * w + 1.6, 44, w - 3.2, 254);
    }

    var pattern = [0, 1, 3, 4, 5];
    for (var oct = 0; oct < 6; oct++) {
      for (var p = 0; p < pattern.length; p++) {
        var idx = oct * 7 + pattern[p];
        if (idx >= n - 1) continue;
        var bg = g.createLinearGradient(0, 44, 0, 212);
        bg.addColorStop(0, '#04050A');
        bg.addColorStop(1, '#20242F');
        g.fillStyle = bg;
        g.fillRect((idx + 1) * w - w * 0.29, 44, w * 0.58, 168);
      }
    }

    // the shadow the fallboard throws over the back of the keys
    var sh = g.createLinearGradient(0, 44, 0, 118);
    sh.addColorStop(0, 'rgba(0,0,0,0.78)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = sh; g.fillRect(0, 44, 1024, 74);

    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }

  function roundRect(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }

  function labelTexture(text, accent) {
    var c = document.createElement('canvas');
    c.width = 256; c.height = 128;
    var g = c.getContext('2d');
    // brass is the dwell ring's colour and means "you are selecting this", so the
    // tag is deliberately not brass: pale, like a physical tag, and readable
    // against a dark ceiling without pretending to be a progress indicator
    g.fillStyle = accent ? 'rgba(239,233,223,0.95)' : 'rgba(14,13,12,0.82)';
    roundRect(g, 5, 5, 246, 118, 24); g.fill();
    g.strokeStyle = accent ? 'rgba(48,41,37,0.85)' : 'rgba(201,145,63,0.55)';
    g.lineWidth = accent ? 5 : 3;
    roundRect(g, 5, 5, 246, 118, 24); g.stroke();
    g.fillStyle = accent ? '#191614' : '#EFE9DF';
    // shrink to fit rather than run off the plate: "hold still to place" and
    // "music window" are both wider than the label at the nominal size
    var size = 40;
    g.font = '600 ' + size + 'px system-ui, sans-serif';
    while (size > 17 && g.measureText(text).width > 212) {
      size -= 2;
      g.font = '600 ' + size + 'px system-ui, sans-serif';
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(text, 128, 66);
    return new THREE.CanvasTexture(c);
  }

  // ---------- the two rigs ----------

  // a unit plane or a unit disc, scaled per panel, so one geometry swap is the
  // whole of the shape toggle. the projective shader ignores uvs, so neither
  // needs its own texture coordinates.
  function panelGeometry(round) {
    return round ? new THREE.CircleGeometry(0.5, 48) : new THREE.PlaneGeometry(1, 1);
  }

  function makePanel(init) {
    var p = {
      kind: 'panel', on: true,
      azim: RIG_YAW, elev: THREE.MathUtils.degToRad(-14), dist: 1.05,
      w: 1.05, h: 0.59, round: false,
      group: null, win: null
    };
    if (init) {
      for (var k in init) if (Object.prototype.hasOwnProperty.call(p, k)) p[k] = init[k];
    }
    p.group = new THREE.Group();
    p.win = new THREE.Mesh(panelGeometry(p.round), windowMaterial());
    p.group.add(p.win);
    p.group.visible = p.on;
    scene.add(p.group);
    return p;
  }

  function setPanelShape(p, round) {
    p.round = !!round;
    p.win.geometry.dispose();
    p.win.geometry = panelGeometry(p.round);
  }

  function removePanel(i) {
    var p = panels[i];
    if (!p) return;
    scene.remove(p.group);
    p.win.geometry.dispose();
    panels.splice(i, 1);
    if (movingRig === p) { movingRig = null; hintPlate.visible = false; }
  }

  // a new window lands beside the ones already out rather than on top of them
  function addPanel() {
    if (panels.length >= PANEL_MAX) return null;
    var p = makePanel({ azim: RIG_YAW + THREE.MathUtils.degToRad(30 * panels.length) });
    panels.push(p);
    placeAll();
    return p;
  }

  function buildPianoRig() {
    var r = piano;
    var g = new THREE.Group();
    // polished ebony is nearly black but it is never flat black; the highlight is
    // the whole reason it reads as a solid object and not a hole in the panorama
    var ebony = new THREE.MeshStandardMaterial({ color: 0x0D0C0B, roughness: 0.22, metalness: 0.10 });
    var ebonyMatte = new THREE.MeshStandardMaterial({ color: 0x0A0908, roughness: 0.62, metalness: 0.04 });
    var brass = new THREE.MeshStandardMaterial({ color: 0x5A4420, roughness: 0.68, metalness: 0.45 });
    var felt = new THREE.MeshStandardMaterial({ color: 0x5A1F24, roughness: 0.95 });

    // the window on your real keys, lying flat where the keybed is, so you look
    // down into it rather than at it
    r.win = new THREE.Mesh(new THREE.PlaneGeometry(1.06, 0.30), windowMaterial());
    r.win.rotation.x = -Math.PI / 2;
    r.win.position.y = 0.001;
    r.win.visible = false;
    g.add(r.win);

    // same footprint, untouched UVs, showing the drawn keybed until video arrives
    r.fallback = new THREE.Mesh(
      new THREE.PlaneGeometry(1.06, 0.30),
      new THREE.MeshBasicMaterial({ map: keybedTexture() })
    );
    r.fallback.rotation.x = -Math.PI / 2;
    g.add(r.fallback);

    // key slip along the front edge, the bit nearest your stomach. matte, because
    // a polished upward face this close to the eye blows out into a headlamp
    var slip = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.030, 0.055), ebonyMatte);
    slip.position.set(0, 0.008, 0.178);
    g.add(slip);

    // a thin edge on the slip, so the near lip of the piano has a line
    var edge = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.004, 0.008), brass);
    edge.position.set(0, 0.024, 0.205);
    g.add(edge);

    // cheek blocks either side of the keys
    [-1, 1].forEach(function (s) {
      var cheek = new THREE.Mesh(new THREE.BoxGeometry(0.070, 0.072, 0.360), ebony);
      cheek.position.set(s * 0.565, 0.030, 0.005);
      g.add(cheek);
    });

    // fallboard tipped back off the keys, then the music desk above it
    var fall = new THREE.Mesh(new THREE.BoxGeometry(1.20, 0.185, 0.026), ebony);
    fall.position.set(0, 0.082, -0.172);
    fall.rotation.x = -0.22;
    g.add(fall);

    var lip = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.022, 0.032), ebony);
    lip.position.set(0, 0.112, -0.228);
    g.add(lip);

    var desk = new THREE.Mesh(new THREE.BoxGeometry(1.02, 0.300, 0.018), ebonyMatte);
    desk.position.set(0, 0.248, -0.270);
    desk.rotation.x = -0.30;
    g.add(desk);

    // the rim running away from you, with the strip of felt you catch under the lid
    var rim = new THREE.Mesh(new THREE.BoxGeometry(1.34, 0.090, 1.05), ebony);
    rim.position.set(0, 0.150, -0.860);
    g.add(rim);

    var strip = new THREE.Mesh(new THREE.BoxGeometry(1.16, 0.006, 0.160), felt);
    strip.position.set(0, 0.198, -0.402);
    g.add(strip);

    g.visible = false;
    r.group = g;
    scene.add(g);
  }

  // when the camera arrives after the rigs are already built, hand it to both windows
  function attachVideo() {
    winMat.uniforms.uVideo.value = videoTex;
    winMat.uniforms.uHasVideo.value = 1;
    if (piano.win) piano.win.visible = true;
    if (piano.fallback) piano.fallback.visible = false;
    for (var i = 0; i < panels.length; i++) panels[i].win.visible = true;
  }

  // ---------- placement ----------

  function head() { return new THREE.Vector3(0, EYE, 0); }

  function placePanel(r) {
    var d = new THREE.Vector3(
      Math.cos(r.elev) * Math.sin(r.azim),
      Math.sin(r.elev),
      -Math.cos(r.elev) * Math.cos(r.azim)
    );
    var h = head();
    r.group.position.copy(h.clone().addScaledVector(d, r.dist));
    r.group.scale.set(r.w, r.h, 1);
    r.group.lookAt(h);
  }

  function placePiano() {
    var r = piano;
    var p = new THREE.Vector3(
      Math.sin(r.yaw) * r.dist,
      EYE - r.drop,
      -Math.cos(r.yaw) * r.dist
    );
    r.group.position.copy(p);
    // Turn the piano to keep the keys towards you wherever you drag it, so it
    // swings around you rather than spinning on the spot. The group's local +Z
    // is the player's side, and the way back to your head from a point at
    // azimuth yaw is (-sin yaw, cos yaw), which Ry reaches at -yaw. Using +yaw
    // turned it away at twice the drag angle instead.
    r.group.rotation.y = -r.yaw;
    r.group.scale.setScalar(r.width);
  }

  function placeAll() {
    placePiano();
    for (var i = 0; i < panels.length; i++) {
      panels[i].group.visible = panels[i].on;
      placePanel(panels[i]);
    }
  }

  function placeRig(r) {
    if (r.kind === 'deck') placePiano(); else placePanel(r);
  }

  function refreshPickables() {
    pickables = [];
    if (menu.tab.visible) pickables.push(menu.tab);
    for (var i = 0; i < menu.ring.length; i++) {
      if (menu.ring[i].visible) pickables.push(menu.ring[i]);
    }
    for (var j = 0; j < menu.bloom.length; j++) {
      if (menu.bloom[j].visible) pickables.push(menu.bloom[j]);
    }
  }

  // ---------- menu ----------

  // A ring of icons rather than a list of words. Position is what you remember,
  // not the reading, so nothing moves and nothing is ever replaced: picking an
  // item blooms its options outward beside it while the ring stays where it
  // was. That also means there is no "back" anywhere in here.
  var MENU_REACH = 0.85, MENU_IDLE = 8;
  var TILE = 0.105;
  var RING_R = THREE.MathUtils.degToRad(12);
  var BLOOM_PITCH = THREE.MathUtils.degToRad(4);
  var BLOOM_STEP = THREE.MathUtils.degToRad(8.2);
  var BLOOM_SHIFT = THREE.MathUtils.degToRad(6);
  var BLOOM_REACH = THREE.MathUtils.degToRad(26);   // furthest a row may sit off centre

  var menu = {
    open: false, sel: -1, idle: 0,
    tabYaw: 0, tabPitch: THREE.MathUtils.degToRad(38),
    ringYaw: 0, ringPitch: THREE.MathUtils.degToRad(26),
    tab: null, ring: [], bloom: []
  };
  var texCache = {};
  var allTiles = [];

  // The coordinate space is minus fifty to fifty about the centre, so every
  // glyph is drawn at one scale whatever size the tile ends up.
  function drawGlyph(g, name) {
    g.strokeStyle = '#F1F3F5';
    g.fillStyle = '#F1F3F5';
    g.lineWidth = 7;
    g.lineCap = 'round';
    g.lineJoin = 'round';

    function arrow(x1, y1, x2, y2) {
      g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
      var a = Math.atan2(y2 - y1, x2 - x1), h = 13;
      g.beginPath();
      g.moveTo(x2, y2);
      g.lineTo(x2 - h * Math.cos(a - 0.5), y2 - h * Math.sin(a - 0.5));
      g.lineTo(x2 - h * Math.cos(a + 0.5), y2 - h * Math.sin(a + 0.5));
      g.closePath(); g.fill();
    }

    if (name === 'piano') {
      g.strokeRect(-46, -26, 92, 52);
      for (var i = -1; i <= 1; i++) {
        g.beginPath(); g.moveTo(i * 23, -26); g.lineTo(i * 23, 26); g.stroke();
      }
      [-34, -11, 12, 35].forEach(function (x) { g.fillRect(x - 6, -26, 12, 30); });
      return;
    }
    if (name === 'window') {
      g.strokeRect(-40, -34, 80, 68);
      g.lineWidth = 5;
      g.beginPath();
      g.moveTo(0, -34); g.lineTo(0, 34);
      g.moveTo(-40, 0); g.lineTo(40, 0);
      g.stroke();
      return;
    }
    if (name === 'room') {
      g.strokeRect(-46, -30, 52, 60);
      g.strokeRect(-6, -12, 52, 42);
      return;
    }
    if (name === 'recenter') {
      g.beginPath(); g.arc(0, 0, 26, 0, 6.284); g.stroke();
      [[0, -46, 0, -32], [0, 46, 0, 32], [-46, 0, -32, 0], [46, 0, 32, 0]].forEach(function (l) {
        g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); g.stroke();
      });
      g.beginPath(); g.arc(0, 0, 6, 0, 6.284); g.fill();
      return;
    }
    if (name === 'close') {
      g.beginPath();
      g.moveTo(-30, -30); g.lineTo(30, 30);
      g.moveTo(30, -30); g.lineTo(-30, 30);
      g.stroke();
      return;
    }
    if (name === 'move') {
      arrow(0, 0, 0, -40); arrow(0, 0, 0, 40);
      arrow(0, 0, -40, 0); arrow(0, 0, 40, 0);
      return;
    }
    if (name === 'bigger')   { g.strokeRect(-14, -14, 28, 28); arrow(-12, 12, -40, 40); arrow(12, -12, 40, -40); return; }
    if (name === 'smaller')  { g.strokeRect(-14, -14, 28, 28); arrow(-40, 40, -12, 12); arrow(40, -40, 12, -12); return; }
    if (name === 'wider')    { g.strokeRect(-16, -22, 32, 44); arrow(-22, 0, -46, 0); arrow(22, 0, 46, 0); return; }
    if (name === 'narrower') { g.strokeRect(-16, -22, 32, 44); arrow(-46, 0, -24, 0); arrow(46, 0, 24, 0); return; }
    if (name === 'taller')   { g.strokeRect(-22, -16, 44, 32); arrow(0, -22, 0, -46); arrow(0, 22, 0, 46); return; }
    if (name === 'shorter')  { g.strokeRect(-22, -16, 44, 32); arrow(0, -46, 0, -24); arrow(0, 46, 0, 24); return; }
    if (name === 'shape') {
      g.strokeRect(-44, -30, 44, 60);
      g.beginPath(); g.arc(16, 0, 28, 0, 6.284); g.stroke();
      return;
    }
    if (name === 'hide' || name === 'show') {
      g.beginPath();
      g.moveTo(-44, 0); g.quadraticCurveTo(0, -34, 44, 0);
      g.quadraticCurveTo(0, 34, -44, 0);
      g.stroke();
      g.beginPath(); g.arc(0, 0, 11, 0, 6.284); g.fill();
      if (name === 'hide') {
        g.lineWidth = 8;
        g.beginPath(); g.moveTo(-38, -30); g.lineTo(38, 30); g.stroke();
      }
      return;
    }
    if (name === 'add') {
      g.beginPath();
      g.moveTo(0, -34); g.lineTo(0, 34);
      g.moveTo(-34, 0); g.lineTo(34, 0);
      g.stroke();
      return;
    }
  }

  // Icon above, a small word below it. The word stays because an icon on its
  // own asks you to guess, and guessing is what the old menu got wrong.
  function iconTexture(icon, label, accent) {
    var c = document.createElement('canvas');
    c.width = 160; c.height = 160;
    var g = c.getContext('2d');

    g.fillStyle = accent ? 'rgba(239,233,223,0.95)' : 'rgba(20,22,25,0.88)';
    roundRect(g, 4, 4, 152, 152, 26); g.fill();
    g.strokeStyle = accent ? 'rgba(48,41,37,0.85)' : 'rgba(201,145,63,0.5)';
    g.lineWidth = accent ? 5 : 3;
    roundRect(g, 4, 4, 152, 152, 26); g.stroke();

    g.save();
    g.translate(80, 64);
    g.scale(0.6, 0.6);
    if (accent) { g.strokeStyle = '#191614'; g.fillStyle = '#191614'; }
    drawGlyph(g, icon);
    g.restore();

    g.fillStyle = accent ? '#191614' : '#D8DCE1';
    var size = 26;
    g.font = '500 ' + size + 'px system-ui, sans-serif';
    while (size > 13 && g.measureText(label).width > 138) {
      size -= 1;
      g.font = '500 ' + size + 'px system-ui, sans-serif';
    }
    g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, 80, 132);

    var t = new THREE.CanvasTexture(c);
    t.minFilter = THREE.LinearFilter;
    return t;
  }

  function cachedIcon(icon, label) {
    var k = 'i|' + icon + '|' + label;
    if (!texCache[k]) texCache[k] = iconTexture(icon, label, false);
    return texCache[k];
  }

  function cachedLabel(text, accent) {
    var k = (accent ? 'A:' : 'P:') + text;
    if (!texCache[k]) texCache[k] = labelTexture(text, accent);
    return texCache[k];
  }

  function plate(w, h, tex) {
    var m = new THREE.Mesh(
      new THREE.PlaneGeometry(w, h),
      new THREE.MeshBasicMaterial({ map: tex || null, transparent: true, depthTest: false })
    );
    m.renderOrder = 10;
    return m;
  }

  function aimAt(obj, yawA, pitchA, radius) {
    var h = head();
    obj.position.set(
      h.x + radius * Math.cos(pitchA) * Math.sin(yawA),
      h.y + radius * Math.sin(pitchA),
      h.z - radius * Math.cos(pitchA) * Math.cos(yawA)
    );
    obj.lookAt(h);
  }

  function makeTile() {
    var t = plate(TILE, TILE, null);
    t.renderOrder = 11;
    t.visible = false;
    var fg = new THREE.PlaneGeometry(1, TILE);
    fg.translate(0.5, 0, 0);
    var fill = new THREE.Mesh(fg, new THREE.MeshBasicMaterial({
      color: 0xC9913F, transparent: true, opacity: 0.34, depthTest: false
    }));
    fill.renderOrder = 12;
    fill.position.set(-TILE / 2, 0, 0.001);
    fill.visible = false;
    t.add(fill);
    t.userData.fill = fill;
    scene.add(t);
    return t;
  }

  function buildMenu() {
    menu.tab = plate(0.17, 0.085, cachedLabel('menu', true));
    menu.tab.userData.id = 'open';
    menu.tab.visible = false;
    scene.add(menu.tab);

    var i;
    for (i = 0; i < 6; i++) menu.ring.push(makeTile());
    for (i = 0; i < 7; i++) menu.bloom.push(makeTile());
    allTiles = menu.ring.concat(menu.bloom);

    hintPlate = plate(0.34, 0.085, cachedLabel('hold still to place'));
    hintPlate.renderOrder = 13;
    hintPlate.visible = false;
    scene.add(hintPlate);

    menuTip = plate(0.40, 0.10, cachedLabel('look up for the menu'));
    menuTip.renderOrder = 11;
    menuTip.visible = false;
    scene.add(menuTip);
  }

  function setHint(text) {
    hintPlate.material.map = cachedLabel(text);
    hintPlate.material.needsUpdate = true;
  }

  function ringItems() {
    var out = [{ id: 'sel:piano', icon: 'piano', label: 'piano' }];
    for (var i = 0; i < panels.length; i++) {
      out.push({
        id: 'sel:panel:' + i, icon: 'window',
        label: panels.length > 1 ? 'window ' + (i + 1) : 'window'
      });
    }
    if (panels.length < PANEL_MAX) out.push({ id: 'addpanel', icon: 'add', label: 'add' });
    out.push({
      id: 'room', icon: 'room',
      label: document.getElementById('env').value === 'img-stage' ? 'green room' : 'stage'
    });
    out.push({ id: 'recenter', icon: 'recenter', label: 'recentre' });
    out.push({ id: 'close', icon: 'close', label: 'close' });
    return out.slice(0, menu.ring.length);
  }

  function bloomItems(ringId) {
    if (ringId === 'sel:piano') {
      return [
        { id: 'move:piano', icon: 'move', label: 'move' },
        { id: 'bigger', icon: 'bigger', label: 'bigger', repeat: true },
        { id: 'smaller', icon: 'smaller', label: 'smaller', repeat: true },
        { id: 'hide:piano', icon: piano.on ? 'hide' : 'show', label: piano.on ? 'hide' : 'show' }
      ];
    }
    var m = /^sel:panel:(\d+)$/.exec(ringId || '');
    if (m) {
      var i = m[1], pan = panels[parseInt(i, 10)];
      if (!pan) return [];
      return [
        { id: 'move:' + i, icon: 'move', label: 'move' },
        { id: 'wider:' + i, icon: 'wider', label: 'wider', repeat: true },
        { id: 'narrower:' + i, icon: 'narrower', label: 'narrower', repeat: true },
        { id: 'taller:' + i, icon: 'taller', label: 'taller', repeat: true },
        { id: 'shorter:' + i, icon: 'shorter', label: 'shorter', repeat: true },
        { id: 'shape:' + i, icon: 'shape', label: pan.round ? 'square' : 'round' },
        { id: 'hide:' + i, icon: pan.on ? 'hide' : 'show', label: pan.on ? 'hide' : 'show' }
      ];
    }
    return [];
  }

  function placeTile(tile, item, yawA, pitchA) {
    tile.visible = true;
    tile.userData.id = item.id;
    tile.userData.repeat = !!item.repeat;
    tile.material.map = cachedIcon(item.icon, item.label);
    tile.material.needsUpdate = true;
    tile.scale.setScalar(1);
    aimAt(tile, yawA, pitchA, MENU_REACH);
  }

  function layoutMenu() {
    var i;
    menu.tab.visible = false;
    menuTip.visible = false;
    for (i = 0; i < menu.ring.length; i++) menu.ring[i].visible = false;
    for (i = 0; i < menu.bloom.length; i++) menu.bloom[i].visible = false;

    if (!inScene || movingRig || recentering) { refreshPickables(); return; }

    if (!menu.open) {
      menu.tab.visible = true;
      aimAt(menu.tab, menu.tabYaw, menu.tabPitch, MENU_REACH);
      if (!menuFound) {
        menuTip.visible = true;
        aimAt(menuTip, menu.tabYaw, THREE.MathUtils.degToRad(13), MENU_REACH);
      }
      refreshPickables();
      return;
    }

    var items = ringItems();
    if (menu.sel >= items.length) menu.sel = -1;

    // evenly round the ring from the top, clockwise, so an item keeps its place
    // between one visit and the next and you can go to it without reading
    var n = items.length;
    for (i = 0; i < n; i++) {
      var t = i * 2 * Math.PI / n;
      placeTile(menu.ring[i], items[i],
        menu.ringYaw + RING_R * Math.sin(t),
        menu.ringPitch + RING_R * Math.cos(t));
    }

    if (menu.sel >= 0) {
      var bl = bloomItems(items[menu.sel].id);
      var st = menu.sel * 2 * Math.PI / n;
      // The options sit in one row under the ring rather than fanning outward
      // from the item. Outward from the top of the ring meant looking up past
      // 45 degrees; this keeps every choice in the same comfortable band. The
      // row slides towards whichever item you picked, and that item stays
      // enlarged, so it still reads as having come from there.
      // a long row is already near the edge of an easy glance, so the further
      // it reaches the less it is allowed to slide towards its item
      var half = (bl.length - 1) / 2 * BLOOM_STEP;
      var room = Math.max(0, BLOOM_REACH - half);
      var shift = Math.max(-BLOOM_SHIFT, Math.min(BLOOM_SHIFT, RING_R * Math.sin(st)));
      shift = Math.max(-room, Math.min(room, shift));
      for (i = 0; i < bl.length && i < menu.bloom.length; i++) {
        placeTile(menu.bloom[i], bl[i],
          menu.ringYaw + shift + (i - (bl.length - 1) / 2) * BLOOM_STEP,
          BLOOM_PITCH);
      }
      menu.ring[menu.sel].scale.setScalar(1.12);
    }
    refreshPickables();
  }

  function buildReticle() {
    reticle = new THREE.Group();
    var dot = new THREE.Mesh(
      new THREE.RingGeometry(0.005, 0.007, 24),
      new THREE.MeshBasicMaterial({ color: 0xEFE9DF, transparent: true, opacity: 0.5, depthTest: false })
    );
    dot.renderOrder = 20;
    reticleRing = new THREE.Mesh(
      new THREE.RingGeometry(0.010, 0.015, 32, 1, Math.PI / 2, 0.001),
      new THREE.MeshBasicMaterial({ color: 0xC9913F, transparent: true, opacity: 0, depthTest: false, side: THREE.DoubleSide })
    );
    reticleRing.renderOrder = 21;
    reticle.add(dot);
    reticle.add(reticleRing);
    reticle.position.set(0, 0, -0.6);
    reticle.visible = false;
    camera.add(reticle);
  }

  // ---------- panorama ----------

  // Which column of each panorama should sit dead ahead, as a fraction across
  // the image. An unrotated inverted sphere puts u = 0.75 in front of you, and
  // on the stage capture that is the house-left wall, so you started off looking
  // at the side of the proscenium with the audience over your shoulder. The
  // house runs from about 0.325 to 0.735 with its centre near 0.54, so 0.43
  // faces you between house right and house centre.
  var ENV_FORWARD = { 'img-stage': 0.43, 'img-green': 0.75 };

  function loadSky(id) {
    var img = document.getElementById(id);
    if (!img) { errEl.textContent = 'That panorama is missing.'; return; }
    var fwd = ENV_FORWARD.hasOwnProperty(id) ? ENV_FORWARD[id] : 0.75;
    sky.rotation.y = 2 * Math.PI * (fwd + 0.25);
    function apply() {
      var t = new THREE.Texture(img);
      t.minFilter = THREE.LinearFilter;
      t.needsUpdate = true;
      if (skyTex) skyTex.dispose();
      skyTex = t;
      sky.material.dispose();
      sky.material = new THREE.MeshBasicMaterial({ map: t });
    }
    if (img.complete && img.naturalWidth) apply();
    else {
      img.addEventListener('load', apply, { once: true });
      img.addEventListener('error', function () { errEl.textContent = 'The panorama did not load.'; }, { once: true });
    }
  }

  function startPassthrough() {
    if (videoTex) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      errEl.textContent = 'This page cannot open the camera here. The keys window stays dark; the physical cutout still works.';
      return;
    }
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false })
      .then(function (stream) {
        videoEl = document.createElement('video');
        videoEl.setAttribute('playsinline', '');
        videoEl.muted = true;
        videoEl.srcObject = stream;
        videoEl.play();
        videoTex = new THREE.VideoTexture(videoEl);
        videoTex.minFilter = THREE.LinearFilter;
        attachVideo();
      })
      .catch(function () {
        errEl.textContent = 'Camera access was refused. The keys window stays dark; the physical cutout still works.';
      });
  }

  // ---------- remembering your setup ----------

  // Placing a window from inside a viewer is fiddly enough that doing it again
  // every session is the worst of the friction. Everything below survives a
  // reload; nothing here leaves the phone.
  var STORE_KEY = 'hill-practice-space-v2';

  // There is no piano in the green room, so the rigs cannot be one global set
  // that follows you between the two. Each room keeps its own arrangement, and
  // switching stows the one you are leaving and lays out the one you arrive in.
  var ROOM_DEFAULTS = {
    'img-stage': { pianoOn: true,  panelOn: true },
    'img-green': { pianoOn: false, panelOn: true }
  };
  var rooms = {};
  var currentEnv = null;

  function stowRoom() {
    if (!currentEnv) return;
    rooms[currentEnv] = {
      piano: {
        on: !!piano.on, yaw: piano.yaw, drop: piano.drop,
        dist: piano.dist, width: piano.width
      },
      panels: panels.map(function (q) {
        return { on: !!q.on, azim: q.azim, elev: q.elev, dist: q.dist,
                 w: q.w, h: q.h, round: !!q.round };
      })
    };
  }

  function layOutRoom(env) {
    var saved = rooms[env];
    var defs = ROOM_DEFAULTS[env] || ROOM_DEFAULTS['img-stage'];

    while (panels.length) removePanel(0);

    if (saved && saved.piano) {
      piano.on    = saved.piano.on !== false;
      piano.yaw   = num(saved.piano.yaw,   RIG_YAW, -Math.PI, Math.PI);
      piano.drop  = num(saved.piano.drop,  0.46, 0.10, 1.10);
      piano.dist  = num(saved.piano.dist,  0.44, 0.20, 1.20);
      piano.width = num(saved.piano.width, 1.0,  0.40, 2.40);
    } else {
      piano.on = defs.pianoOn;
      piano.yaw = RIG_YAW; piano.drop = 0.46; piano.dist = 0.44; piano.width = 1.0;
    }
    piano.group.visible = piano.on;

    var list = (saved && Object.prototype.toString.call(saved.panels) === '[object Array]')
      ? saved.panels : null;
    if (list) {
      for (var i = 0; i < list.length && panels.length < PANEL_MAX; i++) {
        var q = list[i];
        if (!q || typeof q !== 'object') continue;
        panels.push(makePanel({
          on:    q.on !== false,
          azim:  num(q.azim,  RIG_YAW, -Math.PI, Math.PI),
          elev:  num(q.elev,  THREE.MathUtils.degToRad(-14), -1.5, 1.5),
          dist:  num(q.dist,  1.05, 0.35, 1.80),
          w:     num(q.w,     1.05, 0.25, 2.40),
          h:     num(q.h,     0.59, 0.25, 2.40),
          round: !!q.round
        }));
      }
    }
    if (!panels.length) { var np = addPanel(); if (np) np.on = defs.panelOn; }

    currentEnv = env;
    placeAll();
  }

  function goToRoom(env) {
    if (env === currentEnv) return;
    stowRoom();
    layOutRoom(env);
    loadSky(env);
    menu.sel = -1;
    layoutMenu();
    scheduleSave();
  }
  var saveTimer = null;

  function saveState() {
    stowRoom();
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        env: currentEnv || document.getElementById('env').value,
        menuFound: !!menuFound,
        rooms: rooms
      }));
    } catch (e) { /* private window, blocked storage, quota: not worth a fuss */ }
  }

  // smaller and bigger fire every frame while you hold a gaze on them,
  // so coalesce the writes rather than hammering storage sixty times a second
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveState, 400);
  }

  // a coalesced write is a write you can lose by closing the tab inside the
  // window, so commit any pending one the moment the page goes away
  function flushSave() {
    if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; }
    saveState();
  }
  window.addEventListener('pagehide', flushSave);
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) flushSave();
  });

  // stored numbers are only trusted inside the range the control itself allows,
  // so a corrupt or hand-edited entry cannot strand a window somewhere unusable
  function num(v, fallback, lo, hi) {
    return (typeof v === 'number' && isFinite(v) && v >= lo && v <= hi) ? v : fallback;
  }

  function loadState() {
    var raw = null;
    try { raw = localStorage.getItem(STORE_KEY); } catch (e) { return; }
    if (!raw) return;
    var s = null;
    try { s = JSON.parse(raw); } catch (e) { return; }
    if (!s || typeof s !== 'object') return;

    if (s.env === 'img-stage' || s.env === 'img-green') {
      document.getElementById('env').value = s.env;
    }
    menuFound = !!s.menuFound;
    if (s.rooms && typeof s.rooms === 'object') {
      if (s.rooms['img-stage']) rooms['img-stage'] = s.rooms['img-stage'];
      if (s.rooms['img-green']) rooms['img-green'] = s.rooms['img-green'];
    }
  }

  // ---------- head tracking ----------

  function enableOrientation() {
    return new Promise(function (resolve) {
      var D = window.DeviceOrientationEvent;
      function attach() { window.addEventListener('deviceorientation', onOrient, true); resolve(true); }
      if (D && typeof D.requestPermission === 'function') {
        D.requestPermission().then(function (r) {
          if (r === 'granted') attach();
          else {
            errEl.textContent = 'Motion access was refused. Turn on Settings, Apps, Safari, Motion & Orientation Access.';
            resolve(false);
          }
        }).catch(function () { resolve(false); });
      } else if (D) { attach(); } else { resolve(false); }
    });
  }

  function onOrient(e) {
    if (e.alpha === null || e.alpha === undefined) return;
    orient = { alpha: e.alpha, beta: e.beta, gamma: e.gamma, orient: (window.orientation || 0) };
    // the first reading after entering is what "straight ahead" means, so the
    // house lands where it was aimed instead of wherever the compass points
    if (pendingRecenter) { pendingRecenter = false; doRecenter(); }
  }

  var zee = new THREE.Vector3(0, 0, 1);
  var euler = new THREE.Euler();
  var q0 = new THREE.Quaternion();
  var q1 = new THREE.Quaternion(-Math.SQRT1_2, 0, 0, Math.SQRT1_2);
  function applyOrientation(obj) {
    var a = THREE.MathUtils.degToRad(orient.alpha) + yawOffset;
    var b = THREE.MathUtils.degToRad(orient.beta);
    var g = THREE.MathUtils.degToRad(orient.gamma);
    var o = THREE.MathUtils.degToRad(orient.orient);
    euler.set(b, a, -g, 'YXZ');
    obj.quaternion.setFromEuler(euler);
    obj.quaternion.multiply(q1);
    obj.quaternion.multiply(q0.setFromAxisAngle(zee, -o));
  }

  function viewCamera() {
    if (mode === 'xr' && renderer.xr.isPresenting) {
      var c = renderer.xr.getCamera(camera);
      if (c) return c;
    }
    return camera;
  }

  // ---------- gaze ----------

  // rebuilding ring geometry every frame churns memory on a phone,
  // so only redraw when the arc actually moves a visible amount
  var lastArc = -1;
  // hover and progress live on the row itself; the reticle is only for aiming
  function paintSlots(hit, progress) {
    // one flat list built once: this runs every frame
    for (var i = 0; i < allTiles.length; i++) {
      var s = allTiles[i];
      if (!s.visible) continue;
      var on = (s === hit);
      var picked = (menu.sel >= 0 && s === menu.ring[menu.sel]);
      s.scale.setScalar(on ? 1.14 : (picked ? 1.12 : 1));
      var f = s.userData.fill;
      f.visible = on && progress > 0.01;
      if (f.visible) f.scale.x = TILE * Math.min(1, progress);
    }
  }

  function setReticle(progress, color) {
    var p = THREE.MathUtils.clamp(progress, 0, 1);
    var q = Math.round(p * 24) / 24;
    if (q !== lastArc) {
      lastArc = q;
      reticleRing.geometry.dispose();
      reticleRing.geometry = new THREE.RingGeometry(
        0.010, 0.015, 32, 1, Math.PI / 2, -Math.max(q, 0.001) * Math.PI * 2
      );
    }
    reticleRing.material.color.setHex(color);
    reticleRing.material.opacity = p > 0.02 ? 0.95 : 0;
  }

  function updateGaze(dt) {
    var inSpace = inScene;
    reticle.visible = inSpace;
    if (!inSpace) { gazeHit = null; paintSlots(null, 0); return; }

    var vc = viewCamera();
    vc.updateMatrixWorld();
    vPos.setFromMatrixPosition(vc.matrixWorld);
    vc.getWorldQuaternion(tmpQ);
    vDir.set(0, 0, -1).applyQuaternion(tmpQ);

    if (movingRig || recentering) {
      if (movingRig) updateMovingRig(vDir);
      if (armDir.lengthSq() === 0) armDir.copy(vDir);
      // net angle from where the hold was armed, not distance travelled, so
      // jitter cannot quietly add up to it
      var turned = THREE.MathUtils.radToDeg(armDir.angleTo(vDir));

      var gYaw = Math.atan2(vDir.x, -vDir.z);
      var gPitch = Math.asin(THREE.MathUtils.clamp(vDir.y, -1, 1));
      aimAt(hintPlate, gYaw, gPitch + 0.19, MENU_REACH);
      hintPlate.visible = true;

      // holding your head still is how you commit when there is no button
      moveAge += dt;
      var raw = lastDir.lengthSq()
        ? THREE.MathUtils.radToDeg(lastDir.angleTo(vDir)) / Math.max(dt, 1e-4)
        : 0;
      lastDir.copy(vDir);
      swingAvg += (raw - swingAvg) * Math.min(1, dt / SWING_SMOOTH);

      // a wobble takes progress back rather than wiping it, so a twitch a second
      // into holding still costs you a moment, not the whole attempt
      if (swingAvg > STEADY_LIMIT) steady = Math.max(0, steady - dt * STEADY_DECAY);
      else steady += dt;

      setReticle(steady / PLACE_DWELL, 0xC9913F);
      if (steady >= PLACE_DWELL && moveAge > MIN_MOVE) {
        if (movingRig) drop();
        else if (turned > MIN_TURN) finishRecenter();
      }
      return;
    }
    hintPlate.visible = false;

    if (cooldown > 0) {
      cooldown = Math.max(0, cooldown - dt);
      setReticle(0, 0xEFE9DF);
      paintSlots(null, 0);
      gazeHit = null; gazeHeld = 0;
      return;
    }

    raycaster.set(vPos, vDir);
    var hits = raycaster.intersectObjects(pickables, false);
    var obj = hits.length ? hits[0].object : null;

    // a slot you just used will not fire again until your gaze has left it.
    // tiles are reused as the ring changes, so without this the stare that
    // picked one runs straight on into whatever lands in its place.
    if (obj !== mustLeave) mustLeave = null;
    else if (obj) { gazeHit = obj; gazeHeld = 0; setReticle(0, 0xEFE9DF); paintSlots(obj, 0); return; }

    if (obj !== gazeHit) { gazeHit = obj; gazeHeld = 0; }
    if (!obj) {
      setReticle(0, 0xEFE9DF);
      paintSlots(null, 0);
      // a menu you have stopped using folds itself back down to the tab
      if (menu.open) {
        menu.idle += dt;
        if (menu.idle > MENU_IDLE) { menu.open = false; menu.idle = 0; layoutMenu(); }
      }
      return;
    }
    menu.idle = 0;
    gazeHeld += dt;

    var prog;
    if (obj.userData.repeat) {
      prog = gazeHeld > REPEAT_DELAY ? 1 : gazeHeld / REPEAT_DELAY;
      if (gazeHeld > REPEAT_DELAY) activate(obj.userData.id, dt);
      setReticle(prog, 0xC9913F);
    } else if (gazeHeld > DWELL) {
      activate(obj.userData.id, dt);
      mustLeave = obj;
      cooldown = COOLDOWN;
      prog = 1;
    } else {
      prog = Math.max(0, gazeHeld) / DWELL;
      setReticle(prog, 0xC9913F);
    }
    paintSlots(obj, prog);
  }

  function updateMovingRig(vDir) {
    var r = movingRig;
    if (r.kind === 'panel') {
      r.azim = Math.atan2(vDir.x, -vDir.z);
      r.elev = Math.asin(THREE.MathUtils.clamp(vDir.y, -1, 1));
    } else {
      // the piano stays flat and square to you; your gaze sets how far out
      // and how far down it sits, and which way it is turned
      var reach = 0.85;
      var pitchA = Math.asin(THREE.MathUtils.clamp(vDir.y, -1, 1));
      r.yaw = Math.atan2(vDir.x, -vDir.z);
      r.drop = Math.max(0.10, Math.min(1.10, -Math.sin(pitchA) * reach));
      r.dist = Math.max(0.22, Math.min(1.20, Math.abs(Math.cos(pitchA)) * reach));
    }
    placeRig(r);
  }

  function armHold() {
    steady = 0;
    moveAge = 0;
    swingAvg = 0;
    lastDir.set(0, 0, 0);
    armDir.set(0, 0, 0);
  }

  function grab(r) {
    if (!r) return;
    movingRig = r;
    setHint('hold still to place');
    armHold();
    layoutMenu();
  }

  // Recenter cannot fire the instant you pick it, because to pick it you are
  // looking 48 degrees off to the left at the menu, and front would end up
  // there. So it arms, you look where you want front to be, and holding still
  // commits it, the same gesture as putting a window down.
  function startRecenter() {
    menu.open = false;
    recentering = true;
    setHint('look ahead, hold still');
    armHold();
    layoutMenu();
  }

  function finishRecenter() {
    recentering = false;
    steady = 0;
    hintPlate.visible = false;
    doRecenter();
    layoutMenu();
    cooldown = COOLDOWN;
  }

  function doRecenter() {
    if (mode === 'stereo' && orient) yawOffset = -THREE.MathUtils.degToRad(orient.alpha);
    yaw = 0; pitch = 0;
  }

  function drop() {
    movingRig = null;
    steady = 0;
    hintPlate.visible = false;
    placeAll();
    layoutMenu();
    scheduleSave();
    // do not let the stare that placed it fall straight onto the menu
    cooldown = COOLDOWN;
  }

  function activate(id, dt) {
    var step = dt || 0.016;
    if (!id) return;

    if (id === 'open')  { menu.open = true; menu.sel = -1; menu.idle = 0; menuFound = true; scheduleSave(); layoutMenu(); return; }
    if (id === 'close') { menu.open = false; menu.idle = 0; layoutMenu(); return; }
    if (id === 'recenter') { startRecenter(); return; }

    if (id === 'room') {
      var el = document.getElementById('env');
      el.value = (el.value === 'img-stage') ? 'img-green' : 'img-stage';
      goToRoom(el.value);
      return;
    }
    // picking a ring item does not replace anything: it blooms beside it
    if (id.indexOf('sel:') === 0) {
      var ring = ringItems();
      for (var k = 0; k < ring.length; k++) {
        if (ring[k].id === id) { menu.sel = (menu.sel === k) ? -1 : k; break; }
      }
      menu.idle = 0;
      layoutMenu();
      return;
    }

    if (id === 'addpanel') {
      var added = addPanel();
      if (added) { menu.sel = panels.length; scheduleSave(); }
      layoutMenu();
      return;
    }

    if (id === 'smaller') { piano.width = Math.max(0.40, piano.width - step * SIZE_RATE); placeAll(); scheduleSave(); return; }
    if (id === 'bigger')  { piano.width = Math.min(2.40, piano.width + step * SIZE_RATE); placeAll(); scheduleSave(); return; }

    var colon = id.indexOf(':');
    if (colon < 0) return;
    var verb = id.slice(0, colon), arg = id.slice(colon + 1);

    if (verb === 'hide') {
      var target = (arg === 'piano') ? piano : panels[parseInt(arg, 10)];
      if (target) { target.on = !target.on; placeAll(); scheduleSave(); }
      if (piano.group) piano.group.visible = piano.on;
      layoutMenu();
      return;
    }

    if (verb === 'move') {
      menu.open = false;
      grab(arg === 'piano' ? piano : panels[parseInt(arg, 10)]);
      return;
    }

    var p = panels[parseInt(arg, 10)];
    if (!p) { menu.sel = -1; layoutMenu(); return; }

    if (verb === 'shape')  { setPanelShape(p, !p.round); scheduleSave(); layoutMenu(); return; }
    if (verb === 'remove') {
      removePanel(parseInt(arg, 10));
      menu.sel = -1;
      placeAll(); scheduleSave(); layoutMenu();
      return;
    }

    if (verb === 'wider')    p.w = Math.min(2.40, p.w + step * SIZE_RATE);
    if (verb === 'narrower') p.w = Math.max(0.25, p.w - step * SIZE_RATE);
    if (verb === 'taller')   p.h = Math.min(2.40, p.h + step * SIZE_RATE);
    if (verb === 'shorter')  p.h = Math.max(0.25, p.h - step * SIZE_RATE);
    placeAll();
    scheduleSave();
  }

  function onTrigger() {
    if (!inScene) return;
    if (movingRig) { drop(); return; }
    if (recentering) { finishRecenter(); return; }
    if (gazeHit) { activate(gazeHit.userData.id, 0.08); cooldown = COOLDOWN; return; }
    // button pressed while looking at nothing opens the menu at its parked spot
    if (!menu.open) { menu.open = true; menu.sel = -1; menu.idle = 0; menuFound = true; layoutMenu(); }
  }

  // ---------- render ----------

  var lc = new THREE.PerspectiveCamera(), rc = new THREE.PerspectiveCamera();
  var IPD = 0.062;
  function render(t) {
    var now = (t || 0) / 1000;
    var dt = lastT ? Math.min(now - lastT, 0.1) : 0.016;
    lastT = now;

    if (mode === 'stereo' && orient) applyOrientation(camera);
    if (mode === 'flat') camera.rotation.set(pitch, yaw, 0, 'YXZ');

    updateGaze(dt);
    updateWindowProjection();

    if (mode === 'stereo') {
      var w = renderer.domElement.width, h = renderer.domElement.height;
      camera.updateMatrixWorld();
      [lc, rc].forEach(function (c, i) {
        c.fov = 78; c.aspect = (w / 2) / h; c.near = 0.05; c.far = 1000;
        c.updateProjectionMatrix();
        c.position.setFromMatrixPosition(camera.matrixWorld);
        c.quaternion.setFromRotationMatrix(camera.matrixWorld);
        c.translateX((i === 0 ? -1 : 1) * IPD / 2);
        c.updateMatrixWorld(true);
      });
      renderer.setScissorTest(true);
      renderer.setViewport(0, 0, w / 2, h); renderer.setScissor(0, 0, w / 2, h);
      renderer.render(scene, lc);
      renderer.setViewport(w / 2, 0, w / 2, h); renderer.setScissor(w / 2, 0, w / 2, h);
      renderer.render(scene, rc);
      renderer.setScissorTest(false);
    } else {
      renderer.render(scene, camera);
    }
  }

  function onResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }

  function bindInput() {
    var el = renderer.domElement;
    function pt(e) { return e.touches ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { x: e.clientX, y: e.clientY }; }
    var downX = 0, downY = 0, moved = 0;
    function down(e) {
      if (mode !== 'flat') { onTrigger(); return; }
      dragging = true; var p = pt(e); dragX = p.x; dragY = p.y;
      downX = p.x; downY = p.y; moved = 0;
    }
    function move(e) {
      if (!dragging || mode !== 'flat') return;
      var p = pt(e);
      yaw -= (p.x - dragX) * 0.005;
      pitch = Math.max(-1.5, Math.min(1.5, pitch - (p.y - dragY) * 0.005));
      dragX = p.x; dragY = p.y;
      moved = Math.max(moved, Math.abs(p.x - downX) + Math.abs(p.y - downY));
    }
    function up(e) {
      if (dragging && inScene && moved < 8) tapAt(downX, downY);
      dragging = false;
    }

    function tapAt(px, py) {
      var r = el.getBoundingClientRect();
      var ndc = new THREE.Vector2(
        ((px - r.left) / r.width) * 2 - 1,
        -((py - r.top) / r.height) * 2 + 1
      );
      if (movingRig || recentering) {
        if (movingRig) drop(); else finishRecenter();
        return;
      }
      raycaster.setFromCamera(ndc, camera);
      var hits = raycaster.intersectObjects(pickables, false);
      if (hits.length) { activate(hits[0].object.userData.id, 0.25); cooldown = COOLDOWN; }
    }
    el.addEventListener('mousedown', down);
    el.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    el.addEventListener('touchstart', down, { passive: true });
    el.addEventListener('touchmove', move, { passive: true });
    el.addEventListener('touchend', function (e) { up(e); });
    window.addEventListener('keydown', function (e) {
      if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); onTrigger(); }
    });
  }

  function applyOptions() {
    // what you want in a room is a decision for once you are in it, and each
    // room keeps its own answer
    if (!currentEnv) layOutRoom(document.getElementById('env').value);
    piano.group.visible = piano.on;

    // one camera serves everything, so ask for it if anything is showing
    if (piano.on || panels.some(function (q) { return q.on; })) startPassthrough();

    placeAll();
    layoutMenu();
    scheduleSave();
  }

  function showChrome(on) {
    inScene = !!on;
    ui.style.display = on ? 'none' : 'block';
    hud.style.display = on ? 'flex' : 'none';
    if (!on) { movingRig = null; recentering = false; hintPlate.visible = false; }
    layoutMenu();
  }

  function enterVR() {
    navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] })
      .then(function (session) {
        mode = 'xr';
        renderer.xr.setSession(session);
        session.addEventListener('select', onTrigger);
        session.addEventListener('end', function () { mode = 'flat'; movingRig = null; recentering = false; steady = 0; showChrome(false); });
        showChrome(true);
      })
      .catch(function (e) {
        errEl.textContent = 'VR would not start here (' + e.message + '). Falling back to split screen.';
        enterStereo();
      });
  }

  function enterStereo() {
    enableOrientation().then(function (ok) {
      mode = 'stereo';
      yawOffset = 0;
      pendingRecenter = true;
      if (orient) doRecenter();
      showChrome(true);
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
      if (!ok) errEl.textContent = 'Running without head tracking. Drag to look around.';
    });
  }

  init();
  bindInput();
  loadState();

  var envEl = document.getElementById('env');
  var tiles = document.querySelectorAll('.tile');

  function showEnv(value) {
    envEl.value = value;
    for (var i = 0; i < tiles.length; i++) {
      tiles[i].setAttribute('aria-pressed', tiles[i].getAttribute('data-env') === value ? 'true' : 'false');
    }
    if (value === currentEnv) { loadSky(value); return; }
    stowRoom();
    layOutRoom(value);
    loadSky(value);
    scheduleSave();
  }
  for (var t = 0; t < tiles.length; t++) {
    tiles[t].addEventListener('click', function () { showEnv(this.getAttribute('data-env')); });
  }
  envEl.addEventListener('change', function (e) { showEnv(e.target.value); });
  showEnv(envEl.value);

  var note = document.getElementById('modeNote');
  function useStereo() {
    note.textContent = '';
    document.getElementById('enter').onclick = function () { applyOptions(); enterStereo(); };
  }
  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {
      if (ok) {
        note.textContent = '';
        document.getElementById('enter').onclick = function () { applyOptions(); enterVR(); };
      } else { useStereo(); }
    }).catch(useStereo);
  } else { useStereo(); }

  document.getElementById('forget').onclick = function () {
    // v1 held one global arrangement rather than one per room; clear it too
    try { localStorage.removeItem(STORE_KEY); localStorage.removeItem('hill-practice-space-v1'); } catch (e) {}
    location.reload();
  };
  document.getElementById('peek').onclick = function () { applyOptions(); mode = 'flat'; showChrome(true); };
  document.getElementById('exit').onclick = function () {
    var s = renderer.xr.getSession && renderer.xr.getSession();
    if (mode === 'xr' && s) s.end();
    mode = 'flat'; movingRig = null; recentering = false; pendingRecenter = false; steady = 0; showChrome(false);
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
  };
  document.getElementById('recenter').onclick = doRecenter;
}

function startPracticeSpace() {
  try { bootPracticeSpace(); }
  catch (err) {
    var e = document.getElementById('err');
    if (e) e.textContent = 'The 3D view could not start here: ' + err.message;
  }
}
if (document.readyState === 'complete') startPracticeSpace();
else window.addEventListener('load', startPracticeSpace);
</script>

</body>
</html>
