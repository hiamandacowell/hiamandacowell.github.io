<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame version (the 10 line one)</title>
  <!-- This is A-Frame. It is a thin wrapper over three.js that lets you
       write a 3D scene as HTML tags. Everything below is the whole app. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.5.0/aframe.min.js"></script>
</head>
<body>
  <a-scene>
    <a-assets>
      <img id="hall" src="hill-stage.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- the whole environment -->
    <a-sky src="#hall" rotation="0 -90 0"></a-sky>

    <!-- a dark disc under you, so a physical cutout in the viewer
         is not competing with a bright virtual floor -->
    <a-circle position="0 0.05 0" rotation="-90 0 0" radius="4" color="#000"
              opacity="0.9"></a-circle>

    <!-- eye height of someone seated at a piano -->
    <a-entity camera look-controls position="0 1.15 0"></a-entity>
  </a-scene>
</body>
</html>
